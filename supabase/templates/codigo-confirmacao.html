<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#eef0f4;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;color:#151826">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#ffffff;border:1px solid #e3e6ee;border-radius:18px;padding:36px 32px">
            <tr>
              <td>
                <img src="{{ .SiteURL }}/logo.png" width="56" height="56" alt="Catfinance" style="display:block;border-radius:13px" />
                <h1 style="font-size:20px;margin:24px 0 8px">Seu código chegou, miau!</h1>
                <p style="font-size:14px;line-height:22px;color:#5b6176;margin:0 0 24px">
                  Use o código abaixo para confirmar seu e-mail e ativar sua conta no Catfinance. Ele expira em 15 minutos.
                </p>
                <div style="font-size:32px;letter-spacing:10px;font-weight:700;text-align:center;background:#edf7e6;color:#2f7d32;border-radius:14px;padding:18px 0">
                  {{ .Token }}
                </div>
                <p style="font-size:12px;line-height:18px;color:#8a90a3;margin:24px 0 0">
                  Se você não criou uma conta no Catfinance, ignore este e-mail. Nunca compartilhe este código com ninguém.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
