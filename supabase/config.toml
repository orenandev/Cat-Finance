project_id = "catfinance"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/retorno"]
enable_signup = true
enable_manual_linking = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
token_verifications = 30
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_length = 6
otp_expiry = 900

[auth.email.template.confirmation]
subject = "Seu código Catfinance"
content_path = "./supabase/templates/codigo-confirmacao.html"

[auth.email.template.recovery]
subject = "Código para redefinir sua senha"
content_path = "./supabase/templates/codigo-recuperacao.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.external.discord]
enabled = true
client_id = "env(DISCORD_CLIENT_ID)"
secret = "env(DISCORD_CLIENT_SECRET)"

[functions.api]
verify_jwt = false

[functions.excluir-conta]
verify_jwt = true
