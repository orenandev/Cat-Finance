project_id = "catfinance"

[auth]
site_url = "https://catfinancer.vercel.app"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
enable_confirmations = false
secure_password_change = false

[functions.api]
verify_jwt = false

[functions.excluir-conta]
verify_jwt = true
